<?xml version="1.0" encoding="UTF-8"?>
<!-- MK Cards print template. Size: 85 x 55 mm card + 3 mm bleed (91 x 61 mm). Keep text 5 mm inside the trim.
     Placeholders: {{name}} {{title}} {{department}} {{company}} {{mobile}} {{office}} {{phone}} {{whatsapp}} {{email}} {{website}} {{website_url}} {{address}} {{linkedin}} {{link}} {{card_url}} {{username}} {{initials}} {{name_ar}} {{title_ar}} {{department_ar}} {{company_ar}} {{address_ar}}
     The QR code replaces the rectangle with id="qr" (data-color sets its colour).
     Lines inside a group with data-stack="spacing" are left out when their fields are empty, and the rest move up. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="91mm" height="61mm" viewBox="0 0 91 61">
  <rect width="91" height="61" fill="#ffffff"/>
  <rect x="0" y="60.2" width="91" height="0.8" fill="#b0892f"/>
  <text x="9" y="15" font-family="Georgia, 'Times New Roman', serif" font-size="4.2" font-weight="bold" fill="#0f2343">{{name}}</text>
  <text x="9" y="19.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" fill="#4a5672">{{title}}</text>
  <g data-stack="4.5"><text x="9" y="30" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#0f2343">M  {{mobile}}</text><text x="9" y="34.5" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#0f2343">T  {{office}}</text><text x="9" y="39" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#0f2343">E  {{email}}</text><text x="9" y="43.5" font-family="Helvetica, Arial, sans-serif" font-size="2.5" fill="#0f2343">W  {{website}}</text></g>
  <text x="9" y="51" font-family="Helvetica, Arial, sans-serif" font-size="2.2" fill="#b0892f" font-weight="bold">{{link}}</text>
  <rect id="qr" x="60" y="17" width="22" height="22" fill="#0f2343" data-color="#0f2343"/>
  <text x="71" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="1.9" fill="#4a5672">Scan to save my contact</text>
</svg>
