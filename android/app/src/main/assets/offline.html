<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK Cards</title>
<style>
  :root { color-scheme: light dark; --bg: #e9eefb; --ink: #0d1326; --ink2: #4a5470; --glass: rgba(255,255,255,.6); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f1c; --ink: #f3f5fd; --ink2: #b4bcd6; --glass: rgba(40,49,80,.7); } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, Roboto, "Segoe UI", sans-serif; }
  main { margin: 24px; padding: 30px 24px; max-width: 360px; text-align: center; border-radius: 28px; background: var(--glass);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 18px 50px -18px rgba(28,44,92,.4); }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
  p { margin: 0 0 22px; color: var(--ink2); }
  button { min-height: 46px; padding: 0 24px; border: 0; border-radius: 999px; background: #3d6bff; color: #fff; font: inherit; font-weight: 620; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>MK Cards needs an internet connection to load. Check your connection and try again.</p>
  <button onclick="MKNative.retry()">Try again</button>
</main>
</body>
</html>
