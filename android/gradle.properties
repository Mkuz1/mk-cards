org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The address your Cloudflare site is published at (no trailing slash).
# Change this before building a release: the app shows this site and opens its links.
MK_SITE_URL=https://mkcards.pages.dev

# Package name on Google Play. It can never be changed after the first upload.
MK_APPLICATION_ID=app.mkcards
