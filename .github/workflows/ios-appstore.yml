# Builds MK Cards with the current release Xcode, signs it and uploads it to App Store Connect.
# Run it from GitHub: Actions › "iOS App Store upload" › Run workflow.
# Needs three repository secrets (Settings › Secrets and variables › Actions), from App Store Connect ›
# Users and Access › Integrations › App Store Connect API (a Team key with the Admin role):
#   ASC_KEY_ID      the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
name: iOS App Store upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: 5TB6PWV9UN
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest release (non-beta) Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|rc' | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" || { echo "::error::ASC_KEY_P8 does not look like a .p8 key"; exit 1; }

      - name: Create the Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      - name: Archive (signed for the App Store)
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Every upload needs a new build number: 100 + this workflow's run number.
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          echo "Build number $BUILD"
          xcodebuild archive -project MKCards.xcodeproj -scheme MKCards -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MKCards.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            > archive.log 2>&1 || { grep -E "error:|Error" archive.log | sort -u | head -60; tail -30 archive.log; exit 1; }
          echo "Archived."

      - name: Upload to App Store Connect
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MKCards.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { grep -iE "error" export.log | sort -u | head -60; tail -30 export.log; exit 1; }
          tail -5 export.log
          echo "Uploaded. The build appears in App Store Connect › TestFlight within about 30 minutes."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
