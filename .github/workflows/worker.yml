name: Deploy app

# Builds and deploys the MK Cards Worker (web/) on every push to main that changes it,
# or when run by hand from the Actions tab. mkcards.pages.dev is a proxy to this Worker,
# so it shows the new version straight away.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (with "Workers Scripts: Edit") and CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (Google, Wallet keys) stay in Cloudflare and are kept on deploy.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build and deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
